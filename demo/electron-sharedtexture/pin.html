<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline' 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UxPlay PIN</title>
    <style>
      :root {
        --overlay-bg: rgba(12, 16, 22, 0.58);
        --overlay-border: rgba(255, 255, 255, 0.18);
        --text-main: #f5f7fa;
        --text-muted: rgba(245, 247, 250, 0.75);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: var(--text-main);
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .pin-overlay {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--overlay-border);
        border-radius: 999px;
        background: var(--overlay-bg);
        backdrop-filter: blur(14px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        pointer-events: none;
      }

      .pin-label {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .pin-value {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: 24px;
        line-height: 1;
        letter-spacing: 0.22em;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main class="pin-overlay" aria-live="polite">
      <span class="pin-label">PIN</span>
      <output id="pinValue" class="pin-value">----</output>
    </main>
    <script src="./pin-renderer.js"></script>
  </body>
</html>
