<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>UxPlay SharedTexture</title>
    <style>
      :root {
        --overlay-bg: rgba(12, 16, 22, 0.58);
        --overlay-border: rgba(255, 255, 255, 0.18);
        --text-main: #f5f7fa;
        --text-muted: rgba(245, 247, 250, 0.75);
        --ok: #8af5b6;
        --error: #ff9b9b;
        --button-bg: rgba(12, 16, 22, 0.68);
        --button-hover: rgba(27, 38, 52, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: var(--text-main);
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }

      .app-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      #videoCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }

      .pin-overlay {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--overlay-border);
        border-radius: 999px;
        background: var(--overlay-bg);
        backdrop-filter: blur(14px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        pointer-events: none;
        z-index: 10;
        max-width: calc(100vw - 180px);
      }

      .pin-label {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .pin-value {
        font-family: "Cascadia Mono", Consolas, monospace;
        font-size: clamp(18px, 2vw, 24px);
        letter-spacing: 0.22em;
      }

      .pin-port {
        font-size: 12px;
        color: var(--text-muted);
      }

      .status-badge {
        position: absolute;
        left: 16px;
        top: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--overlay-border);
        background: var(--overlay-bg);
        backdrop-filter: blur(12px);
        font-size: 12px;
        color: var(--text-muted);
        z-index: 9;
        pointer-events: none;
      }

      .toolbar {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 12;
      }

      .tool-button {
        width: clamp(118px, 10vw, 148px);
        min-height: 42px;
        border: 1px solid var(--overlay-border);
        border-radius: 12px;
        background: var(--button-bg);
        color: var(--text-main);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background 0.16s ease, transform 0.16s ease, opacity 0.16s ease;
      }

      .tool-button:hover {
        background: var(--button-hover);
        transform: translateX(-1px);
      }

      .tool-button:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }

      .feedback-stack {
        position: absolute;
        right: 170px;
        bottom: 16px;
        max-width: min(44vw, 560px);
        display: grid;
        gap: 6px;
        z-index: 11;
        pointer-events: none;
      }

      .feedback-line {
        padding: 6px 10px;
        border: 1px solid var(--overlay-border);
        border-radius: 10px;
        background: rgba(6, 8, 12, 0.54);
        backdrop-filter: blur(12px);
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .feedback-line[data-tone="success"] {
        color: var(--ok);
      }

      .feedback-line[data-tone="error"] {
        color: var(--error);
      }

      @media (max-width: 980px) {
        .pin-overlay {
          top: 10px;
          max-width: calc(100vw - 20px);
          padding: 8px 12px;
          gap: 8px;
        }

        .pin-value {
          letter-spacing: 0.14em;
        }

        .status-badge {
          top: 64px;
          left: 10px;
        }

        .toolbar {
          right: 10px;
          gap: 8px;
        }

        .tool-button {
          width: 108px;
          min-height: 38px;
          font-size: 12px;
        }

        .feedback-stack {
          right: 10px;
          left: 10px;
          max-width: none;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="videoCanvas"></canvas>

      <div class="pin-overlay" aria-live="polite">
        <span class="pin-label">PIN</span>
        <span id="pinDisplayValue" class="pin-value">----</span>
        <span id="pinPortValue" class="pin-port">Port: -</span>
      </div>

      <div class="status-badge" id="statusBadge">未投屏</div>

      <nav class="toolbar" aria-label="controls">
        <button id="pinSubmitButton" class="tool-button" type="button">刷新 PIN</button>
        <button id="muteToggleButton" class="tool-button" type="button">音频开关</button>
        <button id="stopCastButton" class="tool-button" type="button">停止投屏</button>
        <button id="fullscreenToggleButton" class="tool-button" type="button">全屏切换</button>
      </nav>

      <section class="feedback-stack" aria-live="polite">
        <div id="pinFeedback" class="feedback-line" data-tone="muted">等待控制会话...</div>
        <div id="muteFeedback" class="feedback-line" data-tone="muted">等待控制会话...</div>
        <div id="stopFeedback" class="feedback-line" data-tone="muted">等待控制会话...</div>
        <div id="windowFeedback" class="feedback-line" data-tone="muted">窗口状态同步中...</div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
