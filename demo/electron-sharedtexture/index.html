<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>UxPlay SharedTexture</title>
    <style>
      :root {
        --overlay-bg: rgba(12, 16, 22, 0.58);
        --overlay-border: rgba(255, 255, 255, 0.18);
        --text-main: #f5f7fa;
        --text-muted: rgba(245, 247, 250, 0.75);
        --ok: #8af5b6;
        --error: #ff9b9b;
        --button-bg: rgba(12, 16, 22, 0.68);
        --button-hover: rgba(27, 38, 52, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: var(--text-main);
        font-family: "Segoe UI", "PingFang SC", sans-serif;
      }

      .app-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      #videoCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }

      .status-badge {
        position: absolute;
        left: 16px;
        top: 16px;
        display: none;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--overlay-border);
        background: var(--overlay-bg);
        backdrop-filter: blur(12px);
        font-size: 12px;
        color: var(--text-muted);
        z-index: 9;
        pointer-events: none;
      }

      .toolbar {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.6));
        opacity: 0;
        transition: opacity 0.16s ease;
        z-index: 12;
      }

      .app-shell:hover .toolbar,
      .toolbar.is-active {
        opacity: 1;
      }

      .tool-button {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--overlay-border);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.5);
        color: rgba(255, 255, 255, 0.8);
        cursor: pointer;
        transition:
          background 0.16s ease,
          border-color 0.16s ease,
          color 0.16s ease,
          opacity 0.16s ease,
          transform 0.16s ease;
      }

      .tool-button:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .tool-button:active {
        transform: scale(0.95);
      }

      .tool-button:disabled {
        opacity: 0.52;
        cursor: not-allowed;
      }

      .tool-button.is-active {
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .tool-button--close:hover {
        border-color: rgba(248, 113, 113, 0.5);
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
      }

      .tool-button[hidden] {
        display: none;
      }

      .tool-button__icon {
        width: 20px;
        height: 20px;
        display: block;
      }

      .mute-icon--muted {
        display: none;
      }

      .tool-button.is-muted .mute-icon--muted {
        display: block;
      }

      .tool-button.is-muted .mute-icon--volume {
        display: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .feedback-stack {
        position: absolute;
        right: 170px;
        bottom: 16px;
        display: none;
        max-width: min(44vw, 560px);
        gap: 6px;
        z-index: 11;
        pointer-events: none;
      }

      .feedback-line {
        padding: 6px 10px;
        border: 1px solid var(--overlay-border);
        border-radius: 10px;
        background: rgba(6, 8, 12, 0.54);
        backdrop-filter: blur(12px);
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .feedback-line[data-tone="success"] {
        color: var(--ok);
      }

      .feedback-line[data-tone="error"] {
        color: var(--error);
      }

      @media (max-width: 980px) {
        .status-badge {
          top: 10px;
          left: 10px;
        }

        .toolbar {
          right: 10px;
          gap: 8px;
        }

        .tool-button {
          width: 36px;
          height: 36px;
        }

        .feedback-stack {
          right: 10px;
          left: 10px;
          max-width: none;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="videoCanvas"></canvas>

      <div class="status-badge" id="statusBadge">未投屏</div>

      <nav class="toolbar" aria-label="controls">
        <button
          id="pinSubmitButton"
          class="tool-button"
          type="button"
          aria-label="刷新 PIN"
          hidden
        >
          <span class="sr-only">刷新 PIN</span>
        </button>
        <button
          id="muteToggleButton"
          class="tool-button"
          type="button"
          aria-label="音频开关"
        >
          <svg
            class="tool-button__icon mute-icon--volume"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 9v6h4l5 4V5L8 9H4Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="M16 8.5c1.3 1.9 1.3 5.1 0 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M19 6c2.4 3.4 2.4 8.6 0 12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <svg
            class="tool-button__icon mute-icon--muted"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 9v6h4l5 4V5L8 9H4Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="m18 9 4 4m0-4-4 4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span class="sr-only">音频开关</span>
        </button>
        <button
          id="stopCastButton"
          class="tool-button tool-button--close"
          type="button"
          aria-label="停止投屏"
        >
          <svg
            class="tool-button__icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m6 6 12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span class="sr-only">停止投屏</span>
        </button>
        <button
          id="fullscreenToggleButton"
          class="tool-button"
          type="button"
          aria-label="全屏切换"
          hidden
        >
          <span class="sr-only">全屏切换</span>
        </button>
      </nav>

      <section class="feedback-stack" aria-live="polite">
        <div id="pinFeedback" class="feedback-line" data-tone="muted">等待控制会话...</div>
        <div id="muteFeedback" class="feedback-line" data-tone="muted">等待控制会话...</div>
        <div id="stopFeedback" class="feedback-line" data-tone="muted">等待控制会话...</div>
        <div id="windowFeedback" class="feedback-line" data-tone="muted">窗口状态同步中...</div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
